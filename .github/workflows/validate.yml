name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest ruff
      - run: ruff check .
      - run: pytest

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install --yes libcjson-dev libmosquitto-dev
      - run: cc -Wall -Wextra -Werror -fsyntax-only freetz/package/src/virtual_provider.c -pthread
      - run: cc -Wall -Wextra -Werror -fsyntax-only freetz/package/src/provider_ctl.c
      - run: cc -Wall -Wextra -Werror -fsyntax-only freetz/package/src/provider_selftest.c
      - run: cc -Wall -Wextra -Werror -fsyntax-only freetz/package/src/aha_control.c
      - run: cc -Wall -Wextra -Werror -fsyntax-only freetz/package/src/mqtt_bridge.c
      - run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Ifreetz/package/src freetz/package/src/device_registry.c tests/device_registry_test.c -o /tmp/device_registry_test
      - run: /tmp/device_registry_test
      - run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Ifreetz/package/src freetz/package/src/device_registry.c freetz/package/src/registry_store.c tests/registry_store_test.c -lcjson -o /tmp/registry_store_test
      - run: /tmp/registry_store_test
      - run: cc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Ifreetz/package/src freetz/package/src/device_registry.c freetz/package/src/registry_store.c tests/mqtt_bridge_test.c -lcjson -lpthread -lm -Wl,--gc-sections -o /tmp/mqtt_bridge_test
      - run: /tmp/mqtt_bridge_test
      - run: cc -std=gnu11 -Wall -Wextra -Werror -fPIC -shared freetz/package/src/virtual_provider.c freetz/package/src/device_registry.c -ldl -pthread -o /tmp/virtual_provider.so
      - run: cc -std=gnu11 -Wall -Wextra -Werror freetz/package/src/provider_selftest.c -o /tmp/provider_selftest
      - run: AHA_VIRTUAL_LAB=1 AHA_VIRTUAL_CONTROL_PATH=/tmp/fvb-provider-dynamic.sock LD_PRELOAD=/tmp/virtual_provider.so /tmp/provider_selftest
      - run: AHA_VIRTUAL_LAB=1 AHA_VIRTUAL_LEGACY=1 AHA_VIRTUAL_HANFUN_EXPERIMENT=1 AHA_VIRTUAL_CONTROL_PATH=/tmp/fvb-provider-legacy.sock LD_PRELOAD=/tmp/virtual_provider.so /tmp/provider_selftest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the custom integration with hassfest
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/github/workspace"
          ghcr.io/home-assistant/hassfest
          --integration-path
          /github/workspace/custom_components/fritz_virtual_bridge

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: integration
